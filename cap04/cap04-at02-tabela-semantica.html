<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela Semântica</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    caption {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    th, td {
      border: 1px solid #000;
      padding: 8px;
      text-align: center;
    }

    thead {
      background-color: #dfe6e9;
    }

    tfoot {
      background-color: #f1f2f6;
      font-weight: bold;
    }

    tbody th {
      text-align: left;
    }
  </style>
</head>
<body>

  <table>

    <!-- TÍTULO DA TABELA -->
    <caption>
      Notas Bimestrais 
    </caption>

    <!-- CABEÇALHO -->
    <thead>

      <!-- LINHA DE AGRUPAMENTO -->
      <tr>
        <th scope="col" rowspan="2">Aluno</th>

        <!-- AGRUPA OS 4 BIMESTRES -->
        <th scope="col" colspan="4">Bimestres</th>

        <th scope="col" rowspan="2">Média Final</th>
      </tr>

      <!-- LINHA DOS BIMESTRES -->
      <tr>
        <th scope="col">1º Bimestre</th>
        <th scope="col">2º Bimestre</th>
        <th scope="col">3º Bimestre</th>
        <th scope="col">4º Bimestre</th>
      </tr>

    </thead>

    <!-- CORPO DA TABELA -->
    <tbody>

      <tr>
        <th scope="row">Ana</th>
        <td>8.0</td>
        <td>7.5</td>
        <td>9.0</td>
        <td>8.5</td>
        <td>8.3</td>
      </tr>

      <tr>
        <th scope="row">Bruno</th>
        <td>6.5</td>
        <td>7.0</td>
        <td>8.0</td>
        <td>7.5</td>
        <td>7.3</td>
      </tr>

      <tr>
        <th scope="row">Carla</th>
        <td>9.0</td>
        <td>8.5</td>
        <td>9.5</td>
        <td>10.0</td>
        <td>9.3</td>
      </tr>

      <tr>
        <th scope="row">Daniel</th>
        <td>5.5</td>
        <td>6.0</td>
        <td>7.0</td>
        <td>6.5</td>
        <td>6.3</td>
      </tr>

      <tr>
        <th scope="row">Eduarda</th>
        <td>8.5</td>
        <td>9.0</td>
        <td>8.0</td>
        <td>9.5</td>
        <td>8.8</td>
      </tr>

      <tr>
        <th scope="row">Felipe</th>
        <td>7.0</td>
        <td>7.5</td>
        <td>6.5</td>
        <td>8.0</td>
        <td>7.3</td>
      </tr>

    </tbody>

    <!-- RODAPÉ -->
    <tfoot>
      <tr>

        <!-- CÉLULA DO RÓTULO -->
        <th scope="row" colspan="1">
          Média da turma
        </th>

        <td>7.4</td>
        <td>7.6</td>
        <td>8.0</td>
        <td>8.3</td>
        <td>7.8</td>

      </tr>
    </tfoot>

  </table>

</body>
</html>
